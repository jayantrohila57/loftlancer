name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm check-types
      - run: pnpm test
        env:
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: postgresql://localhost:5432/test
          # TEST-ONLY placeholder for CI; never use this value in any real environment.
          E2E_TEST_SECRET: ci-e2e-test-secret-placeholder
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: true
          DATABASE_URL: postgresql://localhost:5432/test
          BETTER_AUTH_SECRET: ci-build-placeholder-secret-min-32-chars
          BETTER_AUTH_URL: http://localhost:3000
          GITHUB_CLIENT_ID: ci-github-client-id
          GITHUB_CLIENT_SECRET: ci-github-client-secret
          CORS_ORIGIN: http://localhost:3000
          # TEST-ONLY placeholder for CI; never use this value in any real environment.
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
