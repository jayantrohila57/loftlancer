name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump for the release batch
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - loftlancer-development
      - loftlancer-production
    paths:
      - CHANGELOG.md
      - package.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out loftlancer-development
        uses: actions/checkout@v4
        with:
          ref: loftlancer-development
          fetch-depth: 0

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 12.20.0

      - name: Prepare version and changelog
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          node scripts/release/prepare.mjs "$BUMP"
          pnpm release:check origin/loftlancer-production

      - name: Create release PR to loftlancer-development
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          branch="chore/release-v${version}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists; resolve or close its existing release PR before retrying." >&2
            exit 1
          fi

          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v${version}"
          git push origin "$branch"

          cat > "$RUNNER_TEMP/release-pr.md" <<EOF
          ## Release v${version}

          This PR was prepared by the Release workflow from the selected semver bump.

          Review the dated changelog entry, then merge this PR into the loftlancer-development branch. Once it is integrated and quality CI passes, the workflow opens the production release PR to loftlancer-production.
          EOF
          gh pr create \
            --base loftlancer-development \
            --head "$branch" \
            --title "chore(release): v${version}" \
            --body-file "$RUNNER_TEMP/release-pr.md"

          echo "Prepared and opened release PR for v${version}." >> "$GITHUB_STEP_SUMMARY"

  detect-development-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/loftlancer-development'
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 12.20.0
      - name: Detect and validate a release version
        id: detect
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { compareSemver, readVersion } from './scripts/release/changelog.mjs';

          const current = JSON.parse(execFileSync('git', ['show', 'origin/loftlancer-production:package.json'], { encoding: 'utf8' })).version;
          const next = readVersion();
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\n`);
          if (compareSemver(next, current) <= 0) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'is_release=false\n');
            console.log(`No release version on loftlancer-development (${next}; loftlancer-production is ${current}).`);
            process.exit(0);
          }

          execFileSync(process.execPath, ['scripts/release/check.mjs', 'origin/loftlancer-production'], { stdio: 'inherit' });
          appendFileSync(process.env.GITHUB_OUTPUT, 'is_release=true\n');
          NODE

  quality:
    needs: detect-development-release
    if: needs.detect-development-release.outputs.is_release == 'true'
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  open-production-release:
    needs: [detect-development-release, quality]
    if: needs.detect-development-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 12.20.0
      - name: Revalidate and open loftlancer-development-to-loftlancer-production release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin loftlancer-production loftlancer-development
          if [ "$(git rev-parse origin/loftlancer-development)" != "$GITHUB_SHA" ]; then
            echo "loftlancer-development advanced while release validation was running; a new workflow run will validate the latest commit." >&2
            exit 1
          fi
          git fetch origin loftlancer-production
          pnpm release:check origin/loftlancer-production
          version="$(node -p "require('./package.json').version")"
          existing="$(gh pr list --base loftlancer-production --head loftlancer-development --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "Release PR already exists: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { changelogSection, readVersion } from './scripts/release/changelog.mjs';

          const version = readVersion();
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const section = changelogSection(changelog, version);
          if (!section) throw new Error(`Missing changelog section for ${version}`);
          const issues = [...new Set([...section.matchAll(/#(\d+)/g)].map((match) => match[1]))];
          const references = issues.map((number) => `Fixes #${number}`).join('\n');
          const body = [
            `## Production release v${version}`,
            '',
            'Promotes the validated `loftlancer-development` release to production. Merging this PR updates `loftlancer-production`, which triggers the production deployment and publishes the matching Git tag and GitHub Release.',
            '',
            `Quality CI and release validation passed in [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}).`,
            '',
            references,
          ].filter(Boolean).join('\n');
          writeFileSync(process.env.RUNNER_TEMP + '/production-release-pr.md', body + '\n');
          NODE

          gh pr create \
            --base loftlancer-production \
            --head loftlancer-development \
            --title "Release v${version}" \
            --body-file "$RUNNER_TEMP/production-release-pr.md"

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/loftlancer-production'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loftlancer-production
          fetch-depth: 0
      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 12.20.0
      - name: Configure Git identity for release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH: "1"
        run: pnpm release:publish
